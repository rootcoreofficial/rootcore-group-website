name: Prova Windows del riavvio PERRY
on:
  push:
    branches: [fix/desktop-update-restart]
    paths:
      - 'desktop/tests/restart/**'
      - '.github/workflows/desktop-restart-test.yml'
permissions:
  contents: read
jobs:
  windows:
    name: Windows ${{ matrix.base }}
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        base: ['1.1.44', '1.1.45']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./desktop/tests/restart/verify.ps1 -Base '${{ matrix.base }}'
